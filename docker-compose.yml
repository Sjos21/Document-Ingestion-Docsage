services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: docsage
      POSTGRES_PASSWORD: docsage
      POSTGRES_DB: docsage
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docsage -d docsage"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://docsage:docsage@postgres:5432/docsage
      REDIS_URL: redis://redis:6379/0
      STORAGE_PATH: /data/storage
      LOG_JSON: "true"
    ports:
      - "8000:8000"
    volumes:
      - storage_data:/data/storage
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://docsage:docsage@postgres:5432/docsage
      REDIS_URL: redis://redis:6379/0
      STORAGE_PATH: /data/storage
      LOG_JSON: "true"
    volumes:
      - storage_data:/data/storage
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: arq app.worker.WorkerSettings

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
  storage_data:
